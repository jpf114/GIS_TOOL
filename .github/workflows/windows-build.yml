name: windows-build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    # Outer backstop, deliberately not a gate. This job builds gdal/opencv4/proj/qtbase/qtsvg
    # from source via vcpkg (vcpkg.json), the cache key is only hashFiles('vcpkg.json') so any
    # new runner or architecture is a cold miss, and it then does two configure+build rounds,
    # both test runs, real-data regression, NSIS packaging and artifact upload. A cold cache can
    # legitimately exceed 45 minutes, and a job cancellation would land wherever the clock ran
    # out (most likely vcpkg or the compiler) with no more attribution than the 6-hour default
    # it replaces, while silently blocking every push. The attributable bounds are one layer
    # down: the per-test TIMEOUT in tests/CMakeLists.txt and the step-level timeout-minutes on
    # the two test steps.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Install dependencies (global vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 15
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw
                }
              }

              if ($attempt -ge $MaxAttempts) {
                throw "Command failed after $MaxAttempts attempts."
              }

              Write-Host "Attempt $attempt failed; retrying in $DelaySeconds seconds..."
              Start-Sleep -Seconds $DelaySeconds
            }
          }

          Invoke-WithRetry {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows --x-manifest-root=$PWD
          }

      - name: Configure Debug
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --preset debug --fresh

      - name: Configure Release
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --preset release --fresh

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build/debug --config Debug

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/release --config Release

      - name: Test Debug
        # Step-level bound = the attributable layer: a cancelled step still leaves the last
        # "Test #N:" line in the log, a cancelled job leaves only a timestamp. ~3.5x the
        # measured local Debug wall time (311-335s). Catching a hanging case is the job of the
        # per-test TIMEOUT in tests/CMakeLists.txt, so this bound only covers "the whole step
        # wedged" and is deliberately loose rather than tight.
        timeout-minutes: 20
        shell: pwsh
        run: |
          ctest --test-dir build/debug -C Debug --output-on-failure

      - name: Test Release
        # Same reasoning as Test Debug; local Release wall time is 162-171s, so 20 minutes is a
        # wider margin still. Only the two test steps carry a step bound - guessing one for the
        # other steps without timing data is how a correct run turns into a flaky red.
        timeout-minutes: 20
        shell: pwsh
        run: |
          ctest --test-dir build/release -C Release --output-on-failure

      - name: Assert debug-only cases absent in Release
        shell: pwsh
        run: |
          # In Release the two debug-only regressions are excluded by
          # add_test(... CONFIGURATIONS Debug), so they are ABSENT from the test list rather
          # than recorded as skipped. A log reader cannot tell that apart from a case that was
          # deleted, renamed or never registered, so the state is pinned here instead of in a
          # ledger. If either name shows up, the CONFIGURATIONS option has been lost and the
          # case is fake-passing in Release again.
          $releaseList = ctest --test-dir build/release -C Release -N
          if ($LASTEXITCODE -ne 0) {
            throw "ctest --test-dir build/release -C Release -N failed with exit code $LASTEXITCODE"
          }
          foreach ($debugOnlyCase in @(
            'gui_matching_ecc_register_debug_failure_offscreen',
            'gui_matching_stitch_debug_failure_offscreen'
          )) {
            if (@($releaseList | Where-Object { $_ -match [regex]::Escape($debugOnlyCase) }).Count -gt 0) {
              throw "debug-only case $debugOnlyCase is present in the Release test list: restore add_test(... CONFIGURATIONS Debug) in tests/CMakeLists.txt instead of letting it pass"
            }
          }
          Write-Host "debug-only cases absent from the Release test list: OK"
          # Printed, never asserted: the registered total changes legitimately as later tasks
          # add cases, and hard-coding 479 here would turn a correct state into a spurious red.
          # The 481/479 baseline itself belongs in README.md / docs/RELEASE.md (Task 21).
          Write-Host "Release registered test total (informational):"
          $releaseList | Select-String -Pattern 'Total Tests:' | ForEach-Object { $_.Line }

      - name: Install Release
        shell: pwsh
        run: |
          cmake --install build/release --config Release

      - name: Verify installed CLI and GUI
        shell: pwsh
        run: |
          .\install\bin\gis-cli.exe --list
          .\install\bin\gis-cli.exe vector buffer --input "$PWD\tests\data\gui_vector_projected_input.geojson" --distance 10 --output "$PWD\install-smoke-buffer.geojson"
          .\install\bin\gis-gui.exe -platform offscreen --self-test
          Remove-Item -LiteralPath "$PWD\install-smoke-buffer.geojson" -ErrorAction SilentlyContinue

      - name: Real data regression (quick)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --build build/release --config Release --target real_raster_regression real_matching_regression real_vector_regression

      - name: Export vcpkg versions lock
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          .\scripts\export-vcpkg-versions.ps1 -OutputPath docs\vcpkg-versions.lock.txt

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
            if (Test-Path $candidate) {
              $nsis = $candidate
            }
          }
          if (-not $nsis) {
            throw "makensis not found after NSIS installation"
          }
          & $nsis installer\installer.nsi

      - name: Package zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path install -DestinationPath gis-tool-win64.zip -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-zip
          path: gis-tool-win64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-setup
          path: installer/gis-toolkit-1.0.0-win64-setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag installer/gis-toolkit-1.0.0-win64-setup.exe gis-tool-win64.zip --title "GIS TOOLKIT $tag" --notes "Release $tag"
