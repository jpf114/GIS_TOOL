name: windows-build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    # Outer backstop, deliberately not a gate. This job builds gdal/opencv4/proj/qtbase/qtsvg
    # from source via vcpkg (vcpkg.json), the cache key is only hashFiles('vcpkg.json') so any
    # new runner or architecture is a cold miss, and it then does two configure+build rounds,
    # both test runs, real-data regression, NSIS packaging and artifact upload. A cold cache can
    # legitimately exceed 45 minutes, and a job cancellation would land wherever the clock ran
    # out (most likely vcpkg or the compiler) with no more attribution than the 6-hour default
    # it replaces, while silently blocking every push. The attributable bounds are one layer
    # down: the per-test TIMEOUT in tests/CMakeLists.txt and the step-level timeout-minutes on
    # the two test steps.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Install dependencies (global vcpkg)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 15
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw
                }
              }

              if ($attempt -ge $MaxAttempts) {
                throw "Command failed after $MaxAttempts attempts."
              }

              Write-Host "Attempt $attempt failed; retrying in $DelaySeconds seconds..."
              Start-Sleep -Seconds $DelaySeconds
            }
          }

          Invoke-WithRetry {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows --x-manifest-root=$PWD
          }

      - name: Configure Debug
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --preset debug --fresh

      - name: Configure Release
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --preset release --fresh

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build/debug --config Debug

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/release --config Release

      - name: Test Debug
        # Step-level bound = the attributable layer: a cancelled step still leaves the last
        # "Test #N:" line in the log, a cancelled job leaves only a timestamp. ~3.5x the
        # measured local Debug wall time (311-335s). Catching a hanging case is the job of the
        # per-test TIMEOUT in tests/CMakeLists.txt, so this bound only covers "the whole step
        # wedged" and is deliberately loose rather than tight.
        timeout-minutes: 20
        shell: pwsh
        run: |
          ctest --test-dir build/debug -C Debug --output-on-failure

      - name: Test Release
        # Same reasoning as Test Debug; local Release wall time is 162-171s, so 20 minutes is a
        # wider margin still. Only the two test steps carry a step bound - guessing one for the
        # other steps without timing data is how a correct run turns into a flaky red.
        timeout-minutes: 20
        shell: pwsh
        run: |
          ctest --test-dir build/release -C Release --output-on-failure

      - name: Assert debug-only cases absent in Release
        shell: pwsh
        run: |
          # In Release the two debug-only regressions are excluded by
          # add_test(... CONFIGURATIONS Debug), so they are ABSENT from the test list rather
          # than recorded as skipped. A log reader cannot tell that apart from a case that was
          # deleted, renamed or never registered, so the state is pinned here instead of in a
          # ledger. If either name shows up, the CONFIGURATIONS option has been lost and the
          # case is fake-passing in Release again.
          $releaseList = ctest --test-dir build/release -C Release -N
          if ($LASTEXITCODE -ne 0) {
            throw "ctest --test-dir build/release -C Release -N failed with exit code $LASTEXITCODE"
          }
          foreach ($debugOnlyCase in @(
            'gui_matching_ecc_register_debug_failure_offscreen',
            'gui_matching_stitch_debug_failure_offscreen'
          )) {
            if (@($releaseList | Where-Object { $_ -match [regex]::Escape($debugOnlyCase) }).Count -gt 0) {
              throw "debug-only case $debugOnlyCase is present in the Release test list: restore add_test(... CONFIGURATIONS Debug) in tests/CMakeLists.txt instead of letting it pass"
            }
          }
          Write-Host "debug-only cases absent from the Release test list: OK"
          # 注册数闸门（终审第 2 席 I-4 + 第 1 席 I-6）：原来这里只 Write-Host 不判断言，
          #   而上面那条"debug-only 不得出现在 Release 列表"是**单向**的 —— 如果有人把
          #   add_test(... CONFIGURATIONS Debug) 整条删掉，那两条名字既不在 Release 也不在 Debug，
          #   这一步照样全绿。硬编码总数（历史上的 479/481）又会被后续任务的正常增减变成假红，
          #   所以闸门用**跨树算术**：两棵树的注册数都现取，只钉"Release 恒等于 Debug 少 2"这条不变式
          #   （少的正是那两条 CONFIGURATIONS Debug 的用例）。任何一侧整体塌陷都会破坏这条等式。
          $debugList = ctest --test-dir build/debug -C Debug -N
          if ($LASTEXITCODE -ne 0) {
            throw "ctest --test-dir build/debug -C Debug -N failed with exit code $LASTEXITCODE"
          }
          $debugTotal = $null
          $releaseTotal = $null
          foreach ($line in $debugList) {
            if ($line -match 'Total Tests:\s+(\d+)') { $debugTotal = [int]$Matches[1] }
          }
          foreach ($line in $releaseList) {
            if ($line -match 'Total Tests:\s+(\d+)') { $releaseTotal = [int]$Matches[1] }
          }
          if (-not $debugTotal -or -not $releaseTotal) {
            throw "没能从 ctest -N 输出里取到 'Total Tests:'（闸门自身失效，禁止放行；先修解析而不是删断言）"
          }
          if ($releaseTotal -ne ($debugTotal - 2)) {
            throw "注册数不变式被破坏：Debug=$debugTotal Release=$releaseTotal，期望 Release == Debug - 2（少的两条是 CONFIGURATIONS Debug 的 debug-only 用例）。要么有用例整体消失/漏注册，要么那两条的注册方式变了 —— 按 tests/CMakeLists.txt 现读现核，不许改成放宽比较式"
          }
          Write-Host "registered test totals: Debug=$debugTotal Release=$releaseTotal (Release == Debug - 2: OK)"

      - name: Install Release
        shell: pwsh
        run: |
          cmake --install build/release --config Release
          # A nonzero exit code from a native program never reddens a pwsh step by itself: it only
          # lands in $LASTEXITCODE, while the step colour comes from the script terminating. Since
          # N84 was fixed, "no runtime-dep scanner" aborts right here with FATAL_ERROR, so the code
          # has to be asserted at this step — otherwise the real cause gets overwritten later by
          # the crash code of the half-installed package and the log blames the wrong thing.
          if ($LASTEXITCODE -ne 0) {
            throw "cmake --install build/release --config Release failed with exit code $LASTEXITCODE against prefix $PWD\install: the install script refused to resolve runtime dependencies, see cmake/install_runtime_deps.cmake.in"
          }

      - name: Assert installed package closure
        shell: pwsh
        run: |
          # N86. A batch-A review measured this on disk: deleting install\bin\sqldrivers\qsqlite.dll
          # from the finished package left the "Verify installed CLI and GUI" step at OUTER_RC=0.
          # That step can only prove "the package starts"; plugin-class and sidecar resources (Qt
          # platform plugins, sqldrivers, our own plugin_*.dll, the PROJ database) are loaded by name
          # at RUNTIME and appear in nobody's import table, so "the exe starts" is structurally blind
          # to them. This step runs the same script as the ctest case install_closure, so the two
          # consumers cannot drift apart.
          # The scanner path is NOT re-resolved here: N84 was exactly "which DLLs a package contains
          # depended on the packager's PATH at that moment", and the fix made configure resolve it once
          # and bake the absolute path into build\release\install_runtime_deps.cmake. This step reads
          # that same baked value; if it is missing the step goes red instead of skipping the check.
          $baked = $null
          try {
            $baked = Select-String -LiteralPath build/release/install_runtime_deps.cmake `
              -Pattern 'set\(_gis_scanner_command "([^"]*)"\)' -ErrorAction Stop | Select-Object -First 1
          } catch {
            throw "Select-String could not read build/release/install_runtime_deps.cmake against prefix $PWD\install : $($_.Exception.Message) - the generated install script is the only source of the configured scanner path, without it this step cannot judge anything"
          }
          # Select-String is a cmdlet, so it never writes $LASTEXITCODE and a no-match yields $null
          # rather than an error: the judgement has to be on the extracted value itself.
          $scanner = if ($baked) { $baked.Matches[0].Groups[1].Value } else { "" }
          if (-not $scanner) {
            throw "no scanner path baked into build\release\install_runtime_deps.cmake against prefix $PWD\install: configure could not locate a PE import scanner, so package closure is unjudgeable here - refusing to pass instead of skipping the check (look for the 'Runtime dep scanner:' line in the Configure Release step)"
          }
          Write-Host "package closure scanner (baked at configure time): $scanner"
          # Task B6 / Step 4c-3: the closure script must not have to guess the output dialect from the
          # scanner's file name. The ctest case already passes -DSCANNER_TOOL=${GIS_RUNTIME_DEP_SCANNER_TOOL}
          # (tests/CMakeLists.txt); configure bakes that very value into build\release\install_runtime_deps.cmake
          # as set(_gis_scanner_tool "..."), so CI reads the same line instead of re-deriving it here.
          # An unreadable/empty tool value is a RED, never a silent fallback to "it looks like dumpbin".
          $bakedTool = $null
          try {
            $bakedTool = Select-String -LiteralPath build/release/install_runtime_deps.cmake `
              -Pattern 'set\(_gis_scanner_tool "([^"]*)"\)' -ErrorAction Stop | Select-Object -First 1
          } catch {
            throw "Select-String could not read build/release/install_runtime_deps.cmake against prefix $PWD\install : $($_.Exception.Message) - the generated install script is the only source of the configured scanner dialect, without it the two consumers of tests/check_install_closure.cmake would disagree again"
          }
          $scannerTool = if ($bakedTool) { $bakedTool.Matches[0].Groups[1].Value } else { "" }
          if (-not $scannerTool) {
            throw "no scanner tool baked into build\release\install_runtime_deps.cmake against prefix $PWD\install: -DSCANNER_TOOL tells the closure script which import-table format to parse, inferring it from the executable name is what made the CI consumer drift from the ctest one (Step 4c-3) - refusing to pass instead of guessing"
          }
          Write-Host "package closure scanner tool (baked at configure time): $scannerTool"
          # Same discipline for the plugin dll list (G-B5-1): the closure script asserts each
          # plugin_*.dll is present in the package, and the only source of that list is the
          # configure-time derivation from GIS_PLUGIN_TARGETS. The ctest case passes it straight
          # through; here we read the very same list back out of the generated install script,
          # which is where configure baked it. An empty/missing list must go RED instead of
          # silently dropping the whole plugin class of assertions (that is N86's failure shape).
          $bakedPlugins = $null
          try {
            $bakedPlugins = Select-String -LiteralPath build/release/install_runtime_deps.cmake `
              -Pattern 'set\(_gis_plugin_dll_names "([^"]*)"\)' -ErrorAction Stop | Select-Object -First 1
          } catch {
            throw "Select-String could not read build/release/install_runtime_deps.cmake against prefix $PWD\install : $($_.Exception.Message) - the generated install script is the only source of the configured plugin dll list, without it this step cannot judge plugin resource closure at all"
          }
          $pluginDlls = if ($bakedPlugins) { $bakedPlugins.Matches[0].Groups[1].Value } else { "" }
          if (-not $pluginDlls) {
            throw "no plugin dll list baked into build\release\install_runtime_deps.cmake against prefix $PWD\install: the list comes from GIS_PLUGIN_TARGETS via the root CMakeLists.txt, so an empty one means the derivation broke - refusing to pass instead of skipping the plugin assertions"
          }
          Write-Host "package closure plugin list (baked at configure time): $pluginDlls"
          & cmake -DPREFIX="$PWD/install" -DCONFIG=Release "-DSCANNER=$scanner" "-DSCANNER_TOOL=$scannerTool" "-DPLUGIN_DLLS=$pluginDlls" -P tests/check_install_closure.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "package closure assertion failed with exit code $LASTEXITCODE against prefix $PWD\install: cmake --install returned 0 but the package is incomplete (missing sidecar/plugin resource or an unpackaged hard import) - see the [install-closure] lines above"
          }

      - name: Verify installed CLI and GUI
        shell: pwsh
        run: |
          # Every command below is asserted: the three native ones by $LASTEXITCODE, the cleanup by
          # Test-Path (see the 4th block — a cmdlet never writes $LASTEXITCODE). WHY (N84): a package
          # that cannot start does not turn the step red on its own. A crashing native exe only sets
          # $LASTEXITCODE, PowerShell
          # keeps running, and the step exit code comes from the last command — which used to be
          # `Remove-Item … -ErrorAction SilentlyContinue`, i.e. always successful. Measured: with
          # $ErrorActionPreference='Stop' a 0xC0000135 crash still gave outer_rc=0. So CI was green
          # while shipping a build whose `gis-cli.exe --list` returned -1073741515, and installer.nsi
          # (File /r "..\install") plus the zip upload happily shipped it. The fix must keep "bad
          # package == red step", so each throw names the command, its exit code and the prefix.
          .\install\bin\gis-cli.exe --list
          if ($LASTEXITCODE -ne 0) {
            throw ".\install\bin\gis-cli.exe --list failed with exit code $LASTEXITCODE against prefix $PWD\install: the installed CLI does not start, most likely a runtime DLL is missing from install\bin"
          }
          .\install\bin\gis-cli.exe vector buffer --input "$PWD\tests\data\gui_vector_projected_input.geojson" --distance 10 --output "$PWD\install-smoke-buffer.geojson"
          if ($LASTEXITCODE -ne 0) {
            throw ".\install\bin\gis-cli.exe vector buffer failed with exit code $LASTEXITCODE against prefix $PWD\install: the installed CLI starts but cannot run a real plugin action"
          }
          .\install\bin\gis-gui.exe -platform offscreen --self-test
          if ($LASTEXITCODE -ne 0) {
            throw ".\install\bin\gis-gui.exe -platform offscreen --self-test failed with exit code $LASTEXITCODE against prefix $PWD\install: the installed GUI does not pass its offscreen self test"
          }
          # 4th: the smoke output must be gone. Asserting $LASTEXITCODE here would be decoration, not a
          # judgement: Remove-Item is a cmdlet and cmdlets never write $LASTEXITCODE, so the value still
          # belongs to the last *native* command (measured locally: after `cmd /c exit 7` a failing
          # Remove-Item -ErrorAction SilentlyContinue leaves $LASTEXITCODE at 7, so the old throw could
          # never fire). The property that matters is on the filesystem, so test the filesystem: a locked
          # or read-only leftover makes the removal fail and this throw fire.
          Remove-Item -LiteralPath "$PWD\install-smoke-buffer.geojson" -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath "$PWD\install-smoke-buffer.geojson") {
            throw "install-smoke-buffer.geojson still exists after Remove-Item against prefix $PWD\install: cleanup really failed (file locked or read-only), it must not be left in the workspace"
          }

      - name: Real data regression (quick)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake --build build/release --config Release --target real_raster_regression real_matching_regression real_vector_regression

      - name: Export vcpkg versions lock
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          .\scripts\export-vcpkg-versions.ps1 -OutputPath docs\vcpkg-versions.lock.txt

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
            if (Test-Path $candidate) {
              $nsis = $candidate
            }
          }
          if (-not $nsis) {
            throw "makensis not found after NSIS installation"
          }
          # makensis is a native exe, so its code only ever lands in $LASTEXITCODE and a nonzero build
          # leaves the step green by itself. Without this assertion the first thing that notices is the
          # next upload-artifact step complaining that the path has no files: red, but attributed to the
          # wrong step. Same pattern as "Assert debug-only cases absent in Release" above.
          & $nsis installer\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE building installer\installer.nsi against prefix $PWD\install: the NSIS installer was not produced"
          }

      - name: Package zip artifact
        shell: pwsh
        run: |
          # Compress-Archive is a cmdlet, so the "$LASTEXITCODE -ne 0" pattern used elsewhere cannot be
          # copied here — that is precisely the vacuous-assertion trap (a cmdlet never writes that
          # variable, so it would report whatever the last native command left). Its failure surface is
          # the error record instead, and the runner does not set $ErrorActionPreference='Stop' for pwsh
          # steps, so -ErrorAction Stop is written out explicitly and the catch turns it into a throw.
          # The archive is then checked to exist and be non-empty, because "uploaded an empty zip" is
          # exactly the silent-bad-artifact shape this workflow was patched for.
          try {
            Compress-Archive -Path install -DestinationPath gis-tool-win64.zip -Force -ErrorAction Stop
          } catch {
            throw "Compress-Archive -Path install -DestinationPath gis-tool-win64.zip failed against prefix $PWD\install : $($_.Exception.Message)"
          }
          $zipItem = Get-Item -LiteralPath gis-tool-win64.zip -ErrorAction SilentlyContinue
          if (-not $zipItem) {
            throw "gis-tool-win64.zip does not exist after Compress-Archive against prefix $PWD\install: the zip artifact step produced nothing"
          }
          if ($zipItem.Length -eq 0) {
            throw "gis-tool-win64.zip is empty ($($zipItem.Length) bytes) after Compress-Archive against prefix $PWD\install: the zip artifact would ship nothing"
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-zip
          path: gis-tool-win64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-setup
          path: installer/gis-toolkit-1.0.0-win64-setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag installer/gis-toolkit-1.0.0-win64-setup.exe gis-tool-win64.zip --title "GIS TOOLKIT $tag" --notes "Release $tag"
