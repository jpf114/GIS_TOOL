name: windows-build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: 妫€鍑轰粨搴?        uses: actions/checkout@v4

      - name: 缂撳瓨 vcpkg 宸插畨瑁呭寘
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: 瀹夎 vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: 瀹夎渚濊禆
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          C:\vcpkg\vcpkg.exe install gdal opencv4 proj gtest qtbase --triplet x64-windows

      - name: 閰嶇疆 Debug
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake -S . -B build/debug --preset debug

      - name: 閰嶇疆 Release
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake -S . -B build/release --preset release

      - name: 鏋勫缓 Debug
        shell: pwsh
        run: |
          cmake --build build/debug --config Debug

      - name: 鏋勫缓 Release
        shell: pwsh
        run: |
          cmake --build build/release --config Release

      - name: 鎵ц Debug 鍏ㄩ噺娴嬭瘯
        shell: pwsh
        run: |
          ctest --test-dir build/debug -C Debug --output-on-failure

      - name: 鎵ц Release 鍏ㄩ噺娴嬭瘯
        shell: pwsh
        run: |
          ctest --test-dir build/release -C Release --output-on-failure

      - name: 瀹夎 Release
        shell: pwsh
        run: |
          cmake --install build/release --config Release

      - name: 鎵撳寘鏋勫缓浜х墿
        shell: pwsh
        run: |
          Compress-Archive -Path install -DestinationPath gis-tool-win64.zip

      - name: 涓婁紶鏋勫缓浜х墿
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64
          path: gis-tool-win64.zip
