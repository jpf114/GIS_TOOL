name: windows-build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Install manifest dependencies
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 15
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw
                }
              }

              if ($attempt -ge $MaxAttempts) {
                throw "Command failed after $MaxAttempts attempts."
              }

              Write-Host "Attempt $attempt failed; retrying in $DelaySeconds seconds..."
              Start-Sleep -Seconds $DelaySeconds
            }
          }

          Invoke-WithRetry {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows --x-manifest-root=$PWD
          }

      - name: Configure Debug
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 15
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw
                }
              }

              if ($attempt -ge $MaxAttempts) {
                throw "Command failed after $MaxAttempts attempts."
              }

              Write-Host "Attempt $attempt failed; retrying in $DelaySeconds seconds..."
              Start-Sleep -Seconds $DelaySeconds
            }
          }

          Invoke-WithRetry {
            cmake --preset debug --fresh
          }

      - name: Configure Release
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Script,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 15
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Script
                if ($LASTEXITCODE -eq 0) {
                  return
                }
              } catch {
                if ($attempt -ge $MaxAttempts) {
                  throw
                }
              }

              if ($attempt -ge $MaxAttempts) {
                throw "Command failed after $MaxAttempts attempts."
              }

              Write-Host "Attempt $attempt failed; retrying in $DelaySeconds seconds..."
              Start-Sleep -Seconds $DelaySeconds
            }
          }

          Invoke-WithRetry {
            cmake --preset release --fresh
          }

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build/debug --config Debug

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/release --config Release

      - name: Test Debug
        shell: pwsh
        run: |
          ctest --test-dir build/debug -C Debug --output-on-failure

      - name: Test Release
        shell: pwsh
        run: |
          ctest --test-dir build/release -C Release --output-on-failure

      - name: Install Release
        shell: pwsh
        run: |
          cmake --install build/release --config Release

      - name: Verify installed CLI and GUI
        shell: pwsh
        run: |
          .\install\bin\gis-cli.exe --list
          .\install\bin\gis-cli.exe vector buffer --input "$PWD\tests\data\gui_vector_projected_input.geojson" --distance 10 --output "$PWD\install-smoke-buffer.geojson"
          .\install\bin\gis-gui.exe -platform offscreen --self-test
          Remove-Item -LiteralPath "$PWD\install-smoke-buffer.geojson" -ErrorAction SilentlyContinue

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
            if (Test-Path $candidate) {
              $nsis = $candidate
            }
          }
          if (-not $nsis) {
            throw "makensis not found after NSIS installation"
          }
          & $nsis installer\installer.nsi

      - name: Package zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path install -DestinationPath gis-tool-win64.zip -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-zip
          path: gis-tool-win64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-tool-win64-setup
          path: gis-toolkit-1.0.0-win64-setup.exe
